[tool.ruff]
line-length = 100
exclude = [".venv", "snapshots", "templates"]

[tool.ruff.lint]
# Intentionally minimal baseline (syntax errors + undefined names) so introducing
# the linter doesn't force a repo-wide reformat/rewrite of files other agents may
# be actively editing on parallel branches. Broaden this select list gradually as
# existing modules get touched for other reasons, not as a standalone cleanup pass.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Real bug, not a false positive: `exc` from `except Exception as exc:` is
# unbound by Python once the except block exits, but the closure passed to
# `root.after(...)` runs later and still references it. Left as a known issue
# for a dedicated fix rather than folded into this lint-adoption change.
"main.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
